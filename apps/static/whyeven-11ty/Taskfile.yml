version: "3"

vars:
  SBS_ROOT:
    sh: cd "{{.TASKFILE_DIR}}/../../.." && pwd
  COMPOSE_LOCAL: "{{.SBS_ROOT}}/docker-compose.yml:{{.SBS_ROOT}}/compose/99_local.yml"
  COMPOSE_SERVICE: whyeven-web

tasks:
  default:
    desc: List all tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Install Node dependencies (npm ci, requires package-lock.json)
    cmds:
      - npm ci

  dev:
    desc: Run Eleventy dev server with live reload (run install first if needed)
    cmds:
      - npm run dev

  build:
    desc: Build static site into _site
    cmds:
      - npm run build

  clean:
    desc: Remove Eleventy output directory _site
    cmds:
      - rm -rf _site

  init:
    desc: Ensure Colima profile docker and Docker context (local dev)
    cmds:
      - bash "{{.SBS_ROOT}}/scripts/ensure-docker.sh"

  docker-build:
    desc: Build whyeven-web image (sbs compose, local .env)
    deps: [init]
    dir: "{{.SBS_ROOT}}"
    env:
      COMPOSE_FILE: "{{.COMPOSE_LOCAL}}"
      SBS_EXPORT_LOCAL: "1"
    cmds:
      - ./scripts/export_config.sh --local
      - docker compose build {{.COMPOSE_SERVICE}}

  docker-start:
    desc: Build and start whyeven-web (local http://127.0.0.1:9080 without Traefik; via Traefik with dev:start)
    deps: [init]
    dir: "{{.SBS_ROOT}}"
    env:
      COMPOSE_FILE: "{{.COMPOSE_LOCAL}}"
      SBS_EXPORT_LOCAL: "1"
    cmds:
      - ./scripts/export_config.sh --local
      - docker compose up -d --build {{.COMPOSE_SERVICE}}
      - bash ./scripts/print-app-url.sh {{.COMPOSE_SERVICE}}

  docker-stop:
    desc: Stop whyeven-web container
    dir: "{{.SBS_ROOT}}"
    env:
      COMPOSE_FILE: "{{.COMPOSE_LOCAL}}"
    cmds:
      - docker compose stop {{.COMPOSE_SERVICE}}
